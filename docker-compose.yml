services:
  greenforge:
    build:
      context: ./green
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      # Optional: enables OpenAI ranking of candidate fixes.
      # Set in Coolify's env UI, never commit a real key.
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
