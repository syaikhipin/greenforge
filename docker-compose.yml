services:
  greenforge:
    build:
      context: ./green
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      # Optional: enables LLM ranking of candidate fixes (verifier owns the numbers).
      # Opencode Go is used when OPENCODE_API_KEY is set; otherwise OpenAI.
      # Set keys in Coolify's env UI, never commit a real key.
      - OPENCODE_API_KEY=${OPENCODE_API_KEY:-}
      - OPENCODE_GO_MODEL=${OPENCODE_GO_MODEL:-mimo-v2.6-flash}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
